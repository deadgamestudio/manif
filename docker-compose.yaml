# Production: two containers.
#   client  Caddy on :80, the only service reachable from outside. Serves the
#           static build and proxies /colyseus/* to the game server.
#   server  The Colyseus game server (Node), on the internal network only.
# Lobbies live in the server's memory, so a redeploy ends the games in
# progress. The lasting scores (#41) are a SQLite file on the `scores` named
# volume, so they survive redeploys.
#
# On Coolify (https://manif.bazlab.si): give the `client` service the domain
# on port 80; Coolify's proxy adds TLS in front. Leave `server` without a
# domain.
# Locally: docker compose --env-file .env.production.example \
#   -f docker-compose.yaml -f docker-compose.local.yaml up --build
# Every variable is listed in .env.production.example.

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    expose:
      - "2567"
    environment:
      # production: no debug messages (only "development" accepts them).
      NODE_ENV: production
      PORT: "2567"
      # Rustrak DSN for error tracking (public ingest key). A literal default,
      # so it reaches the container even when Coolify passes no env.
      SENTRY_DSN: ${SENTRY_DSN:-https://d0c9bddd10f34714ac2833a55eaf7678@rustrack.bazlab.si/5}
      # The lasting scores (#41), on the volume below. Unwritable or corrupt:
      # the server logs it and runs with round scores only.
      SCORE_DB_PATH: /data/manif.db
    volumes:
      # A named volume, so Coolify keeps it across redeploys. The image makes
      # /data owned by nonroot, and a fresh volume takes that ownership.
      - scores:/data
    # node polls GET /health (the image has no shell or wget).
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:2567/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-/colyseus}
        # Rustrak DSN, inlined into the browser bundle at build time.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-https://d0c9bddd10f34714ac2833a55eaf7678@rustrack.bazlab.si/5}
    restart: unless-stopped
    environment:
      # For the Cloudflare purge after each deploy (scripts/cf-purge.sh, run
      # by Coolify's post-deployment command). Secrets: set them in Coolify,
      # never here. Empty, the purge does nothing.
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  # The lasting scores (#41). Deleting it resets every total to 0.
  scores:
